<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a142f" />
    <meta
      name="description"
      content="Fly a moth through paper walls in Skywright, a one-button arcade game."
    />
    <title>Skywright</title>
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./skywright.js" defer></script>
  </head>
  <body>
    <main id="game" data-phase="ready" aria-label="Skywright arcade game">
      <canvas
        id="sky"
        tabindex="0"
        aria-label="Skywright playfield"
        aria-describedby="flight-help"
      ></canvas>
      <div id="safe-inset" aria-hidden="true"></div>
      <button
        id="pause"
        class="pause"
        type="button"
        aria-label="Pause game"
        title="Pause (Esc)"
        hidden
      >
        <span aria-hidden="true"></span>
      </button>
      <section id="panel" class="panel" aria-labelledby="title">
        <div id="intro-mark" class="gate" aria-hidden="true"><span></span></div>
        <div>
          <p id="eyebrow" class="eyebrow">Choose your flight</p>
          <h1 id="title" tabindex="-1">Skywright</h1>
        </div>
        <p id="flight-help" class="flight-help">
          Tap, click, or press Space to flap. Hold to glide, then release to
          fire at the glowing band.
        </p>
        <div id="results" class="results" hidden>
          <strong id="score"></strong>
          <span id="score-caption"></span>
        </div>
        <div class="menu-actions">
          <button id="levels" class="action" type="button" disabled>
            Levels
          </button>
          <button id="action" class="secondary" type="button" disabled>
            Endless
          </button>
          <button id="tutorial-start" class="secondary" type="button" disabled>
            Tutorial
          </button>
          <button id="main-menu" class="secondary" type="button" hidden>
            Main menu
          </button>
        </div>
        <p id="details" class="details">Endless best 0</p>
        <div class="settings" aria-label="Game settings" role="group">
          <button id="sound" type="button" aria-pressed="true" disabled>
            Sound <span aria-hidden="true">on</span>
          </button>
          <button id="vibration" type="button" aria-pressed="true" hidden>
            Vibration <span aria-hidden="true">on</span>
          </button>
        </div>
      </section>
      <section
        id="level-picker"
        class="panel"
        aria-labelledby="level-heading"
        hidden
      >
        <h1 id="level-heading" tabindex="-1">Levels</h1>
        <p class="flight-help">Clear a level to unlock the next one.</p>
        <div id="level-options" class="menu-actions"></div>
        <button id="level-back" class="secondary" type="button">Back</button>
      </section>
      <button
        id="tutorial-exit"
        class="secondary tutorial-exit"
        type="button"
        hidden
      >
        Exit tutorial
      </button>
      <section
        id="tutorial-guide"
        class="tutorial-guide"
        aria-labelledby="tutorial-heading"
        hidden
      >
        <div role="status">
          <h2 id="tutorial-heading"></h2>
          <p id="tutorial-instructions"></p>
        </div>
        <button id="tutorial-play" class="action" type="button" hidden>
          Choose a level
        </button>
      </section>
      <noscript>Enable JavaScript to play Skywright.</noscript>
    </main>
  </body>
</html>
