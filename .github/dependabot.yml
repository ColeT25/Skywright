version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: gradle
    directory: /web
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    groups:
      kotlin:
        patterns:
          - multiplatform
          - org.jetbrains.kotlin:kotlin-dom-api-compat

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
