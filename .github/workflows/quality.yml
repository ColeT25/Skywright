name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Skywright quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install quality tools
        working-directory: web
        run: npm ci
      - name: Check web formatting
        working-directory: web
        run: npm run format:check
      - name: Check Kotlin, build the site, and measure test coverage
        run: |
          bash web/with-build-java.sh bash -e -c '
            bash ./gradlew -p web --no-daemon --warning-mode fail spotlessCheck jsBrowserDistribution
            npm --prefix web run test:coverage
          '
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run browser tests
        working-directory: web
        run: npm run test:browser
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: skywright-quality-reports
          path: |
            web/build/coverage/report
            web/build/reports/tests/jsNodeTest
            web/build/playwright/results
          if-no-files-found: ignore
